<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知识库agent</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0d0d'/%3E%3Ctext x='32' y='45' font-family='system-ui,sans-serif' font-size='34' font-weight='700' fill='%23fff' text-anchor='middle'%3E文%3C/text%3E%3C/svg%3E" />
  <script src="/marked.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="logo"><span class="logo-text">知识库agent</span></div>
      <button class="btn-new" id="btnNew">＋ 新对话</button>
      <nav class="session-list" id="sessionList"></nav>
    </aside>

    <!-- 主聊天区 -->
    <main class="chat">
      <header class="chat-header">
        <button class="btn-toggle-sidebar" id="btnSidebar" title="收起/展开侧栏">☰</button>
        <span class="chat-title" id="chatTitle">新对话</span>
        <span class="status" id="statusDot"><i></i>就绪</span>
      </header>

      <div class="messages" id="messages">
        <div class="welcome" id="welcome">
          <h1>有什么想了解的？</h1>
          <p class="muted">我可以检索文档库（xlsx / pdf / md）回答你的问题，请尽量具体。</p>
          <div class="suggestions">
            <button class="chip">文档库里有哪些文件？</button>
            <button class="chip">光联正常班 1 号车的发车时间和途经站点</button>
            <button class="chip">洪湾工厂白班上班车有哪些线路？</button>
            <button class="chip">倒班上下班车的时间安排</button>
          </div>
        </div>
      </div>

      <div class="composer-wrap">
        <div class="composer">
          <textarea id="input" rows="1" placeholder="输入问题，Enter 发送，Shift + Enter 换行"></textarea>
          <button class="btn-send" id="btnSend" title="发送" disabled>
            <svg id="iconSend" viewBox="0 0 24 24" width="18" height="18"><path d="M12 4l7 7h-5v9h-4v-9H5z" fill="currentColor"/></svg>
            <svg id="iconStop" viewBox="0 0 24 24" width="16" height="16" style="display:none"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
          </button>
        </div>
        <div class="composer-hint muted">回答基于文档库内容生成，请注意甄别；引用来源以 agent 标注为准。</div>
      </div>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
